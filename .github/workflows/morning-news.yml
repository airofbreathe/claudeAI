name: 아침 뉴스 만들기

on:
  schedule:
    # 한국 시간 새벽 5시 50분, 6시 50분 (GitHub는 UTC 기준이라 9시간 빼서 적음)
    - cron: "50 20,21 * * *"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python news/make_news.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: news/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
